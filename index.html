<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gửi NhuThao 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fbf3fb; --bg2:#efe3f8; --heart:#8e5bd1;
  --env:#ffc8d6; --env-dark:#ffb3c6; --seal:#ff5c82;
  --line:#2b2b2b; --paper:#fffdf8; --ink:#4a3b5c;
  --hint:#7a5aa0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg1:#2a2038;--bg2:#1d1528;--heart:#a37be0;--paper:#fffaf3;--hint:#d2bff0}
}
:root[data-theme="dark"]{--bg1:#2a2038;--bg2:#1d1528;--heart:#a37be0;--paper:#fffaf3;--hint:#d2bff0}
*{box-sizing:border-box;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{
  background:radial-gradient(circle at 50% 30%,var(--bg1),var(--bg2));
  font-family:'Quicksand',system-ui,sans-serif;
  overflow-x:hidden;overflow-y:auto;position:relative;
}
#hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.h{position:absolute;bottom:-60px;color:var(--heart);opacity:.18;filter:blur(1.5px);
  animation:float linear infinite;will-change:transform}
@keyframes float{
  from{transform:translateY(0) translateX(0) rotate(-10deg)}
  50%{transform:translateY(-55vh) translateX(24px) rotate(10deg)}
  to{transform:translateY(-120vh) translateX(-10px) rotate(-8deg)}
}
.stage{position:relative;min-height:100%;display:flex;align-items:center;justify-content:flex-start;flex-direction:column;padding-bottom:24px}
.wrap{position:relative;width:min(88vw,420px);aspect-ratio:1.5;perspective:1200px;
  transform:rotate(-8deg);margin-top:30vh;transition:transform .9s ease, margin-top 1.4s cubic-bezier(.2,.8,.2,1) .4s;
  animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{translate:0 -8px}}
.wrap.open{transform:rotate(0deg);animation:none}

/* envelope */
.body{position:absolute;inset:0;background:var(--env);border-radius:6px;z-index:1}
.front{position:absolute;inset:0;z-index:4;pointer-events:none}
.front svg{width:100%;height:100%;display:block}
.flap{position:absolute;left:0;right:0;top:0;height:56%;z-index:5;transform-origin:top;
  transition:transform .8s cubic-bezier(.5,0,.2,1), z-index 0s .4s;pointer-events:none}
.flap svg{width:100%;height:100%;display:block}
.wrap.open .flap{transform:rotateX(180deg);z-index:2}

/* heart seal */
.seal{position:absolute;left:50%;top:56%;width:15%;aspect-ratio:1;z-index:7;
  transform:translate(-50%,-50%);border:0;background:none;cursor:pointer;padding:0;
  animation:beat 1.4s ease-in-out infinite;transition:opacity .4s}
.seal:focus-visible{outline:3px solid #8e5bd1;outline-offset:6px;border-radius:50%}
.seal svg{width:100%;height:100%;filter:drop-shadow(0 2px 4px rgba(255,92,130,.4))}
@keyframes beat{0%,100%{transform:translate(-50%,-50%) scale(1)}15%{transform:translate(-50%,-50%) scale(1.18)}30%{transform:translate(-50%,-50%) scale(1)}45%{transform:translate(-50%,-50%) scale(1.12)}}
.wrap.open .seal{opacity:0;pointer-events:none;animation:none}

/* letter */
.letter{position:absolute;left:7%;right:7%;bottom:6%;height:86%;z-index:3;
  background:var(--paper);border-radius:6px;padding:7% 7%;
  box-shadow:0 2px 10px rgba(80,40,120,.15);
  transform:translateY(0);opacity:1;
  transition:transform 1.4s cubic-bezier(.2,.8,.2,1) .7s, height 1.4s ease .7s, left 1.4s ease .7s, right 1.4s ease .7s, z-index 0s .9s;
  overflow:hidden}
.wrap.open .letter{z-index:6;transform:translateY(-62%);height:auto;min-height:150%;left:0;right:0;
  box-shadow:0 18px 50px rgba(80,40,120,.28);overflow:visible}
.letter p{font-family:'Dancing Script',cursive;color:var(--ink);font-size:clamp(1.1rem,4.4vw,1.5rem);line-height:1.55;margin-bottom:.7em;
  opacity:0;transform:translateY(12px)}
.letter .to{font-size:clamp(1.4rem,5.5vw,1.9rem);color:#7b4bb7}
.wrap.open .letter p{animation:line .9s ease forwards}
.wrap.open .letter p:nth-child(1){animation-delay:1.9s}
.wrap.open .letter p:nth-child(2){animation-delay:2.7s}
.wrap.open .letter p:nth-child(3){animation-delay:3.7s}
.wrap.open .letter p:nth-child(4){animation-delay:4.7s}
@keyframes line{to{opacity:1;transform:none}}
.sign{text-align:right;color:var(--seal)!important}
.nw{white-space:nowrap}
.wrap.open .letter{z-index:3;height:var(--H);left:3%;right:3%;transform:translateY(calc(var(--rise) * -1));min-height:0;overflow:hidden;box-shadow:0 10px 36px rgba(80,40,120,.25)}

.hint{position:fixed;bottom:calc(8vh + env(safe-area-inset-bottom,0px));color:var(--hint);font-size:1rem;letter-spacing:.02em;transition:opacity .5s}
.hint.gone{opacity:0}

.burst{position:fixed;pointer-events:none;color:var(--seal);font-size:20px;z-index:20;animation:pop 1.2s ease-out forwards}
@keyframes pop{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--x),var(--y)) scale(1.4)}}
@media (prefers-reduced-motion:reduce){
  .h,.wrap,.seal{animation:none!important}
  .letter,.flap,.wrap{transition-duration:.01s!important;transition-delay:0s!important}
  .wrap.open .letter p{animation-duration:.01s!important;animation-delay:0s!important}
}
</style>
</head>
<body>
<div id="hearts" aria-hidden="true"></div>

<main class="stage">
  <div class="wrap" id="wrap">
    <div class="body"></div>

    <article class="letter" id="letter">
      <p class="to">Gửi đến NhuThao,</p>
      <p>Trước hết anh chúc em 20/10 vui vẻ dù đã qua..</p>
      <p>Và anh chúc em luôn luôn vui vẻ, tích cực, yêu thương bản thân và cả anh nữa <span class="nw">&gt;&lt;</span>.</p>
      <p>Dẫu anh biết anh còn nhiều thiếu sót nhưng anh cố để trở thành phiên bản tốt nhất của anh trong mắt của em.</p>
      <p class="sign">♥</p>
    </article>

    <div class="front">
      <svg viewBox="0 0 300 200" preserveAspectRatio="none">
        <path d="M2 198 L2 2 L150 112 L298 2 L298 198 Z" fill="var(--env)" stroke="#2b2b2b" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      </svg>
    </div>

    <div class="flap">
      <svg viewBox="0 0 300 112" preserveAspectRatio="none">
        <path d="M2 2 L150 110 L298 2 Z" fill="var(--env)" stroke="#2b2b2b" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      </svg>
    </div>

    <button class="seal" id="seal" aria-label="Mở thư">
      <svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.8-8 11-8 11z" fill="#ff5c82"/></svg>
    </button>
  </div>
  <p class="hint" id="hint">Chạm vào trái tim để mở thư 💌</p>
</main>

<script>
(function(){
  var box=document.getElementById('hearts'),i,n=22;
  for(i=0;i<n;i++){
    var s=document.createElement('span');s.className='h';s.textContent='♥';
    var size=14+Math.random()*34;
    s.style.left=(Math.random()*100)+'%';
    s.style.fontSize=size+'px';
    s.style.animationDuration=(28+Math.random()*30)+'s';
    s.style.animationDelay=(-Math.random()*50)+'s';
    s.style.opacity=(.1+Math.random()*.14).toFixed(2);
    box.appendChild(s);
  }
  var wrap=document.getElementById('wrap'),seal=document.getElementById('seal'),hint=document.getElementById('hint');
  var letter=document.getElementById('letter');
  function place(){if(wrap.classList.contains('open'))return;wrap.style.marginTop=Math.max(24,(window.innerHeight-wrap.offsetHeight)/2)+'px'}
  place();window.addEventListener('resize',place);
  function measure(){var s=letter.style;s.transition='none';s.left=s.right='3%';s.height='auto';var H=letter.offsetHeight;s.left=s.right=s.height='';void letter.offsetHeight;s.transition='';return H}
  seal.addEventListener('click',function(e){
    if(wrap.classList.contains('open'))return;
    var H=measure(),h=wrap.offsetHeight,top=Math.max(20,(window.innerHeight-(H+.56*h))/2);
    wrap.style.setProperty('--H',H+'px');wrap.style.setProperty('--rise',(.5*h)+'px');
    wrap.style.marginTop=(top+H-.44*h)+'px';
    wrap.classList.add('open');hint.classList.add('gone');
    var r=seal.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    for(var k=0;k<14;k++){
      var b=document.createElement('span');b.className='burst';b.textContent='♥';
      var a=Math.random()*Math.PI*2,d=60+Math.random()*90;
      b.style.left=cx+'px';b.style.top=cy+'px';
      b.style.setProperty('--x',Math.cos(a)*d+'px');
      b.style.setProperty('--y',Math.sin(a)*d+'px');
      b.style.fontSize=(12+Math.random()*16)+'px';
      document.body.appendChild(b);
      setTimeout(function(el){el.remove()},1300,b);
    }
  });
})();
</script>
</body>
</html>
